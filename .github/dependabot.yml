version: 2

# Weekly, and PATCH updates arrive as ONE grouped pull request so the auto-merge workflow
# has a single thing to decide about. Minor and major updates stay ungrouped and unmerged:
# they change behaviour, and behaviour is a person's call.
#
# Kept to the ecosystems this repository actually carries — see the estate survey of
# 2026-07-29: the pure-domain libraries (slf4j + junit) and the stdlib-only Python services
# have nothing here worth a weekly pull request.
# open-pull-requests-limit was 5 until 2026-07-29 and that number silently cost us a bump:
# microservice-memes had five maven PRs open, so the cucumber 7.20.1 -> 7.34.6 update was
# never proposed at all and the service sat a year behind its sibling until a manual sweep
# found it. A truncated queue looks exactly like an empty one - nothing reports the
# difference - so the limit is 10 now.
updates:
  # Pillow — decodes images supplied by anonymous callers, so the first place a decoder CVE would land
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      patches:
        patterns: ["*"]
        update-types: ["patch"]

  # The workflow pins of this repository (actions/checkout and friends). Added 2026-07-30: nothing
  # watched them, so they sat on majors that were two to three releases behind.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      patches:
        patterns: ["*"]
        update-types: ["patch"]

  # Base images in this repository's Dockerfile. Added 2026-07-30: image tags were watched by nothing,
  # so they kept whatever was current when the line was written.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    labels: ["dependencies"]
